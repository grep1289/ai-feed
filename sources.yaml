# Personal agentic-AI feed: sources and filtering
# Edit freely: aifeed/build.py reads this file on every run.
#
# status values
#   checked   = fetched and parsed on 2026-10-05, or (for GitHub) repo and tags confirmed that day
#   id_confirmed = YouTube channel ID read from the channel page on 2026-10-05; the page advertises
#               its feed, but the feed itself could not be fetched by the checking tool
#   page_watch = no feed exists; watch the listing page for new post links
#
# tier values
#   1        = core primary source, always considered
#   2        = broad source, only items matching `include_any` reach the rubric
#   wildcard = wider pool for the single "randomness" slot

version: 1
updated: 2026-10-05

# ---------------------------------------------------------------- digest shape
digest:
  timezone: Asia/Kolkata
  max_items: 5                 # hard stop, no "more" link
  mix: { read: 3, watch: 2 }   # if one kind is short, do not fill with the other
  max_per_source_per_day: 1
  wildcard_slots: 1            # counted inside max_items
  pad_when_short: false        # 2 good items beats 5 mediocre ones
  max_age_days: 14             # for fresh items from tier 2 and wildcard
  backfill:                    # tier-1 blogs publish rarely, so use their back catalogue
    enabled: true
    from_tier: 1
    per_day: 1                 # newest unread first, until exhausted
  releases:
    mode: weekly_rollup        # one block of one-liners, outside the 5 items
    day: monday
    promote_to_daily: major_only   # x.0.0, or sources marked `promote: always`
  overflow: library            # everything that passed but did not fit; searchable, never pushed

# ------------------------------------------------------------- keyword gates
topics:
  agentic: &agentic
    - agent
    - agentic
    - MCP
    - model context protocol
    - A2A
    - LLM
    - tool calling
    - tool use
    - context engineering
    - harness
    - skills
    - eval
    - guardrail
    - sandbox
    - inference gateway
  priority:                    # used by the rubric to break ties, not to exclude
    - building and operating agents in production
    - open standards and protocols (MCP, A2A, AGENTS.md)
    - open-source frameworks, SDKs and gateways
    - agents for platform engineering (CI/CD, IaC, Kubernetes operations, security triage)
    - evaluation, observability and cost control for agents

# ------------------------------------------------------- filtering, in order
filters:
  # Step 1. Mechanical rules. No model call, applied to every item.
  dedupe_by: url               # never by date: generated feeds carry unreliable dates
  drop_prereleases: true       # rc, alpha, beta, dev, nightly, canary
  drop_title_regex:            # case-insensitive
    - '\b(webinar|register now|join us|save the date|call for (papers|proposals)|cfp)\b'
    - '\b(customer story|case study|success story)\b'
    - '\bhow (?!we\b).{2,40} (uses|scales|built .* with|rebuilt .* with)\b'   # "How <company> uses <product>", but not "How we built"
    - '\b(scales|builds|transforms|accelerates|modernizes) .{0,60}\bwith (claude|openai|chatgpt|gemini|copilot)\b'
    - '\bscales (claude|chatgpt|openai|gemini|copilot)\b'
    - '\b(partnership|partnering with|partners with|collaboration with)\b'
    - '\b(funding|series [a-f]\b|valuation|acquires|acquisition)\b'
    - '\b(now generally available|is now available|pricing|new plan)\b'
    - '\b(we.?re hiring|appoints|joins as|welcomes)\b'
    - '\b(recap|highlights|sizzle|trailer|teaser|keynote highlights)\b'
    - '#shorts'
  youtube:
    feed_template: 'https://www.youtube.com/feeds/videos.xml?playlist_id={uploads_playlist}'
    fallback_template: 'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}'
    # uploads_playlist = channel_id with the leading "UC" replaced by "UULF" (long-form only, no Shorts).
    # YouTube feeds fail intermittently: retry, and treat a failed fetch as "no new items", not as an error.

  # Step 2. Model rubric, applied to whatever survives step 1.
  # Runs only when the workflow passes an LLM_API_KEY (set from the GROQ_LLM_API_KEY repository
  # secret in .github/workflows/daily.yml); without it, step 1 decides alone.
  # To change provider: edit base_url and model here, and point the workflow at that provider's secret.
  rubric:
    api: openai                # "openai" = any OpenAI-compatible service; "anthropic" = Anthropic Messages API
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-20b
    request_extra:             # optional settings; dropped automatically if the service rejects them
      max_completion_tokens: 1000
      reasoning_effort: low
      include_reasoning: false
      response_format: { type: json_object }
    pause_seconds: 8           # Groq's free tier allows 8,000 tokens a minute; a call uses about 1,000
    max_calls_per_run: 40
    keep_if_score_at_least: { tier_1: 10, tier_2: 12, wildcard: 12 }   # out of 16
    prompt: |
      You are screening one item for a personal learning feed on agentic AI.
      The reader is an experienced engineering lead who wants to build things himself
      and to know which open-source tools are worth using. He reads the original, not a summary.

      Score each criterion 0 to 4.
        primary    Written or presented by the people who built the thing, describing their own work.
                   0 = commentary on someone else's announcement.
        buildable  Teaches a technique, pattern or design the reader could apply this month.
                   0 = nothing to do after reading.
        substance  Contains code, architecture, measurements, trade-offs or failure modes.
                   0 = claims without detail.
        open       Concerns open-source software, an open standard, or a method that works
                   regardless of vendor. 0 = only usable by buying one product.

      Reject outright, whatever the score, if the item is mainly any of these:
        - a product launch, pricing change or feature list with no explanation of how it works
        - a customer story or testimonial
        - an event promotion, recap or highlights reel
        - a funding, partnership, hiring or policy announcement
        - a benchmark or leaderboard claim with no method
        - a panel or interview with no technical content

      Prefer items matching the priority topics when scores are equal.

      Return JSON only:
        {"keep": true|false, "scores": {"primary": n, "buildable": n, "substance": n, "open": n},
         "kind": "read"|"watch"|"release", "minutes": n,
         "what": "<one sentence: what this is>",
         "why": "<one sentence: what the reader can do with it>",
         "tags": ["..."]}

  # Step 3. Feedback. Each digest item gets keep/skip; review the skips monthly and edit this file.

