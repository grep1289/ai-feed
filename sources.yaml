# ------------------------------------------------- open-source tooling (GitHub)
# Release feed:  https://github.com/{repo}/releases.atom
# Commit feed:   https://github.com/{repo}/commits/{branch}.atom
# All repos below were confirmed to exist on 2026-10-05; feed contents were not fetched.
# `noisy: true` = very frequent or multi-package tags; roll-up shows only the newest tag per week.
github:
  standards_and_protocols:
    - { repo: modelcontextprotocol/modelcontextprotocol, promote: always }   # spec revisions, 9 tags in total
    - { repo: modelcontextprotocol/python-sdk }
    - { repo: modelcontextprotocol/typescript-sdk, noisy: true }
    - { repo: modelcontextprotocol/registry }
    - { repo: a2aproject/A2A, promote: always }
    - { repo: agentsmd/agents.md, feed: commits, branch: main }              # no tagged releases
    - { repo: agentgateway/agentgateway }
    - { repo: aaif-goose/goose }                                             # formerly block/goose

  frameworks_and_sdks:
    - { repo: anthropics/claude-agent-sdk-python }
    - { repo: anthropics/skills, feed: commits, branch: main }               # no tagged releases
    - { repo: openai/openai-agents-python }
    - { repo: openai/codex, noisy: true }
    - { repo: langchain-ai/langgraph, noisy: true }
    - { repo: langchain-ai/deepagents, noisy: true }
    - { repo: google/adk-python }
    - { repo: microsoft/agent-framework, noisy: true }
    - { repo: strands-agents/sdk-python }
    - { repo: pydantic/pydantic-ai }
    - { repo: crewAIInc/crewAI }

  cloud_native_and_devops:
    - { repo: kagent-dev/kagent }
    - { repo: kubernetes-sigs/agent-sandbox }
    - { repo: containers/kubernetes-mcp-server }
    - { repo: github/github-mcp-server }
    - { repo: hashicorp/terraform-mcp-server }
    - { repo: k8sgpt-ai/k8sgpt }
    - { repo: open-telemetry/semantic-conventions, include_any: [gen-ai, gen_ai, genai, agent, mcp] }

  evals_and_observability:
    - { repo: langfuse/langfuse, noisy: true }
    - { repo: Arize-ai/phoenix, noisy: true }
    - { repo: promptfoo/promptfoo }
    - { repo: UKGovernmentBEIS/inspect_ai }

